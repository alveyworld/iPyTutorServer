# HTTP — redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aalang.org;

    return 301 https://$host$request_uri;
}

# HTTPS — proxy to iPyInterVu Go app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aalang.org;

    ssl_certificate /etc/letsencrypt/live/aalang.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aalang.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Static pages and short API calls
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chat API — extend timeouts beyond nginx default 60s for long OpenRouter turns
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_connect_timeout 60s;
    }
}
