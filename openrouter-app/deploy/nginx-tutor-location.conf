# iPyTutor under a path on a site nginx already serves, such as https://intebg.org/tutor/
# next to the iPyIntervu interview app. deploy/add-tutor-path.sh installs this file in
# /etc/nginx/snippets/ (with /tutor replaced if another path is chosen) and includes it in
# the site's HTTPS server block. nginx uses the longest matching prefix, so the site's own
# "/" and "/api/" locations are unaffected.

# The page uses relative paths, so it must be loaded at /tutor/, with the slash.
location = /tutor {
    return 301 /tutor/;
}

location /tutor/ {
    # The trailing slash strips the prefix: /tutor/api/chat reaches the tutor as /api/chat.
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    # A turn can wait on the model for a while; these match the interview's /api/ timeouts.
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    proxy_connect_timeout 60s;
}
